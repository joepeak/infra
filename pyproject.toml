[project]
name = "infra"
version = "0.1.0"
description = "通用基础设施（DB/Redis/Config/Logger/工具）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.27",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
    "apscheduler>=3.10",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "lark-oapi>=1.2",
    "numpy>=1.24",
    "python-dotenv>=1.0",  # infra.bootstrap 自动加载 .env
    "pydantic>=2.0",  # infra.llm models
    "openai>=1.30",  # infra.llm OpenAI provider
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra"]
