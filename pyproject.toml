[project]
name = "infra"
version = "0.1.0"
description = "通用基础设施（DB/Redis/Config/Logger/工具）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.27",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
    "apscheduler>=3.10",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "lark-oapi>=1.2",
    "python-dotenv>=1.0",  # infra.bootstrap 自动加载 .env
    "pydantic>=2.0",  # infra.llm models
    "openai>=1.30",  # infra.llm OpenAI provider
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "aiosqlite>=0.19",  # conftest 用 sqlite 临时文件做集成测试
    "tzdata>=2024.1",   # tests/test_time_util.py 的 America/New_York 等非 UTC tz 测试
    "mypy>=1.10",       # 静态类型检查——AI 写错类型时编译期拦截
    "beartype>=0.18",   # 运行时类型检查——beartype + mypy + 契约测试三道防线
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra"]

# ============================================================
# pytest 配置
# ============================================================
[tool.pytest.ini_options]
# 自动识别 async def test_* ——无需 @pytest.mark.asyncio
asyncio_mode = "auto"
# 关键：所有测试和 async fixture 默认跑在 session 级 event loop，
# 这样 session-scoped 的 DatabaseConnectionManager.engine 不会被换 loop 搞坏。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 测试根目录
testpaths = ["tests"]
# 简短 traceback（CI 友好）
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    # 默认跳过 @pytest.mark.slow 标记的测试（多数是 trend_analyzer 的趋势分支）。
    # 显式跑全部：`pytest -m slow` 或 `pytest -m ""`（清空 deselect）。
    "-m",
    "not slow",
]
# 自定义 marker
markers = [
    "integration: 真 redis 集成测试（默认不跑，手动 pytest -m integration）",
    "unit: 单元测试",
    "slow: 慢速测试",
]

# ============================================================
# mypy 静态类型检查（20260830 加入）
# 目标：AI 写错类型时编译期拦截——避免重复"compute_xxx 返错类型"类 bug。
#
# 策略：渐进式——新加的代码必须标类型，老代码分批修。
# 实施：infra 整体 ignore_errors=true（不阻塞 258 个老错）；
# 但 disallow_untyped_defs=true 全局生效——AI 写新函数不标 mypy 立刻 warn。
#
# 验收：跑 `MYPYPATH=/tmp/mypy_stubs mypy src/infra/redis/decorators.py`
#      会报 cache() 装饰器 + wrapper 内部函数缺类型（disallow_untyped_defs 触发）
# ============================================================
[tool.mypy]
python_version = "3.11"
# 关键 strict 子集
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true

# 老代码 0 增量——分批修
[[tool.mypy.overrides]]
module = "infra"
ignore_errors = true

# 第三方库 stub 兼容问题（sqlalchemy 用的 dynamic typing 太多，忽略）
[[tool.mypy.overrides]]
module = "sqlalchemy"
ignore_errors = true

[[tool.mypy.overrides]]
module = "redis"
ignore_errors = true

# 收窄 ignore_errors 范围——这一轮深度测试覆盖的模块也必须 strict
# （目前只让 infra.redis.decorators 收窄；其他模块留待后续修老错后逐步收窄）
[[tool.mypy.overrides]]
module = "infra.messages"
ignore_errors = false

# 收窄 mq / schedule 的 strict 检查——这次 mq 0 错，schedule 36 错（仅 no-untyped-def 风格）
# 先收窄 mq（已 0 错）——schedule 继续修真错后收窄
[[tool.mypy.overrides]]
module = "infra.mq"
ignore_errors = false

[[tool.mypy.overrides]]
module = "infra.schedule"
ignore_errors = false

[[tool.mypy.overrides]]
module = "infra.llm"
ignore_errors = false

[[tool.mypy.overrides]]
module = "infra.redis"
ignore_errors = false

[[tool.mypy.overrides]]
module = "infra.config"
ignore_errors = false

# 收窄 infra.schedule strict——修真业务 bug（step 38 续）

