[project]
name = "infra"
version = "0.1.0"
description = "通用基础设施（DB/Redis/Config/Logger/工具）"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}

dependencies = [
    "sqlalchemy>=2.0",
    "asyncpg>=0.27",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pyyaml>=6.0",
    "aiohttp>=3.8",
    "apscheduler>=3.10",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "lark-oapi>=1.2",
    "numpy>=1.24",
    "python-dotenv>=1.0",  # infra.bootstrap 自动加载 .env
    "pydantic>=2.0",  # infra.llm models
    "openai>=1.30",  # infra.llm OpenAI provider
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "aiosqlite>=0.19",  # conftest 用 sqlite 临时文件做集成测试
    "tzdata>=2024.1",   # tests/test_time_util.py 的 America/New_York 等非 UTC tz 测试
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infra"]

# ============================================================
# pytest 配置
# ============================================================
[tool.pytest.ini_options]
# 自动识别 async def test_* ——无需 @pytest.mark.asyncio
asyncio_mode = "auto"
# 关键：所有测试和 async fixture 默认跑在 session 级 event loop，
# 这样 session-scoped 的 DatabaseConnectionManager.engine 不会被换 loop 搞坏。
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# 测试根目录
testpaths = ["tests"]
# 简短 traceback（CI 友好）
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    # 默认跳过 @pytest.mark.slow 标记的测试（多数是 trend_analyzer 的趋势分支）。
    # 显式跑全部：`pytest -m slow` 或 `pytest -m ""`（清空 deselect）。
    "-m",
    "not slow",
]
# 自定义 marker
markers = [
    "integration: 集成测试（需要真实 PG/Redis）",
    "unit: 单元测试",
    "slow: 慢速测试",
]
